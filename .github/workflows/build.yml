name: Build & Release
# 由 GitHub Actions 消费：推 v* 标签或手动触发三平台打包
#
# 指纹清单说明：客户端校验用的 src/main/problems/manifest.json（仅 sha256，不含题面）
# 已入库，CI 直接使用，不再运行 gen:manifest（CI 无真题库，重生成会回退成示例题，
# 导致安装包与真题服务器题量不符而无法登录）。换题后本地重跑 gen:manifest 再提交。

# 触发：推送 v* 标签（正式发版）或手动触发（Actions 页面点按钮）
# 注意私有仓库分钟数倍率：Linux 1x / Windows 2x / macOS 10x，
# 一次三平台完整构建约消耗 ~120 分钟额度（免费版 2000 分钟/月）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder 在 tag 构建时要创建 Release 并上传安装包，
# 默认 GITHUB_TOKEN 权限不足（403），必须显式声明
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg: --win
            artifacts: |
              dist/*.exe
              dist/*.blockmap
          - os: macos-latest
            pkg: --mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            pkg: --linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check problem manifest
        run: node -e "const m=require('./src/main/problems/manifest.json');console.log('指纹清单:',m.problems.length,'题 manifestHash='+m.manifestHash);if(!m.problems.length)throw new Error('manifest empty')"

      - name: Build web
        run: npm run build:web

      - name: Package
        run: npx electron-builder ${{ matrix.pkg }} -c electron-builder.config.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinExam-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30
